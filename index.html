<script>
/* ═══ MERGE RACE · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Slide tiles, merge equal numbers. Everyone gets the same tiles in the same order: first
 * to 512 wins, or the best tile when time runs out. Versus, 2–4 players; bots fill seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ board size, the target tile, race length, bots
 *   TILES ......... the color of each number
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   BOARD ......... one board's rules: sliding, merging, the seeded new tiles, getting stuck
 *   RACE (HOST) ... countdown, who reached the target first, the buzzer, the restart
 *   BOTS (HOST) ... a bot keeps its big tiles in one corner, looks two moves ahead, ~2 moves a second
 *   ME ............ my board: moves, publishing
 *   RIVALS ........ other players' boards rebuilt from their snapshots, with sliding tiles
 *   DRAW .......... boards (mine large, rivals small), the race clock, effects
 *   SCREENS ....... sound, hint, results, leaderboard, colors
 *   INPUT ......... arrow keys / WASD, swipe or drag
 *   MAIN LOOP ..... heartbeat, host tick, my tick, draw
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player's board is its OWN entity field `b` = {m, g, s, t, n, k, d, h}: race id,
 *     the 16 cells as one string ("." empty, "a" = 2, "b" = 4, "c" = 8 … a letter per
 *     doubling), score, best tile (as a power of 2), moves, new tiles so far, last move's
 *     direction, and when it reached the target. Also `n` (name), `c` (color), `hb`.
 *   - The HOST (lowest live sessionId) runs the race in ONE shared field, `race`: {id, v, ph,
 *     seed, startAt, endsAt, players, bots, out, winner, nextAt, ready}. It watches every
 *     board's best tile, calls the first to the target (or the best at the buzzer) and
 *     restarts. Bots' boards live in the shared field `bots`.
 *   - Same tiles for everyone: new tile number k comes from mulberry32(race.seed, k), so
 *     every board starts the same and draws the same numbers in the same order.
 *   - The clock is timestamps in `race` (startAt, endsAt), so a new host just carries on.
 *   - ?attract plays offline with bots only, from a mid-race board (the preview video).
 *   - Leaderboard "best-score": each player's best race score.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the race up to this many boards (2–4)
  size: 4,              // the board is size × size
  target: 512,          // first tile of this number wins (a power of 2)
  raceMs: 150000,       // or the best tile wins when this runs out (2:30)
  fourChance: 0.1,      // a new tile is a 4 this often, else a 2
  slideMs: 90,          // tiles slide this long
  jamMs: 900,           // a stuck board (no moves) waits this long, then sheds its smallest tiles
  countdownMs: 3000,    // 3, 2, 1, go
  overMs: 9000,         // the results screen
  botMoveMs: 500,       // a bot slides about this often (lower is faster; 500 reaches 512 in ~2 min)
  botMistake: 0.1,      // chance a bot plays its second-best move
  board: "best-score",  // leaderboard name
};
const BOT_NAMES = ["Mergey", "Twofer", "Slider", "Doubles", "Tilly", "Corner Bot", "Stacks", "Binary"];
const COLORS = ["#ffd23f", "#4cc9f0", "#f72585", "#80ed99", "#ff9f1c", "#b388ff", "#ff6b6b", "#00f5d4"];

// ── TILES ───────────────────────────────────────────────────────────────────────────
// TILE[e] = [background, text] for the tile 2^e. Past the list, the last one repeats.
const TILE = [null, ["#ece8ff", "#3b3566"], ["#d9e4ff", "#2f3a66"], ["#ffbf69", "#4a2a00"], ["#ff9b54", "#fff"], ["#ff6b6b", "#fff"], ["#f03e5f", "#fff"],
  ["#ffd23f", "#4a3500"], ["#80ed99", "#0f4a22"], ["#4cc9f0", "#08304a"], ["#9b5de5", "#fff"], ["#f15bb5", "#fff"], ["#00f5d4", "#06362f"]];
const tileColors = (e) => TILE[Math.min(e, TILE.length - 1)];
const N = CONFIG.size;
const targetExp = () => Math.round(Math.log2(CONFIG.target));

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'merge-race',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field (shared or a player's), parsed once per change. Read-only. */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(last && performance.now() - last > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── BOARD ───────────────────────────────────────────────────────────────────────────
// g[row][col] holds the tile as a power of 2 (0 = empty, 1 = 2, 2 = 4, 3 = 8 …).
// Directions: 0 left, 1 right, 2 up, 3 down.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
/** The i-th cell of a line, counting from the edge the tiles slide toward. */
const cellOf = (dir, line, i) => (dir === 0 ? [line, i] : dir === 1 ? [line, N - 1 - i] : dir === 2 ? [i, line] : [N - 1 - i, line]);
/** Slide every tile one way; equal neighbors merge once. Returns the new grid and what moved where. */
function slide(grid, dir) {
  const g = grid.map((row) => row.slice()), moves = [], merges = [];
  let gained = 0, moved = false;
  for (let line = 0; line < N; line++) {
    const cells = Array.from({ length: N }, (_, i) => cellOf(dir, line, i)), vals = cells.map(([r, c]) => g[r][c]);
    for (const [r, c] of cells) g[r][c] = 0;
    let w = 0, canMerge = false;
    for (let i = 0; i < N; i++) {
      const v = vals[i];
      if (!v) continue;
      const from = cells[i];
      if (canMerge && g[cells[w - 1][0]][cells[w - 1][1]] === v) {
        const to = cells[w - 1];
        g[to[0]][to[1]] = v + 1; gained += 2 ** (v + 1); merges.push([to[0], to[1], v + 1]); moves.push({ from, to, v });
        canMerge = false; moved = true;
      } else {
        const to = cells[w++];
        g[to[0]][to[1]] = v; moves.push({ from, to, v }); canMerge = true;
        if (to[0] !== from[0] || to[1] !== from[1]) moved = true;
      }
    }
  }
  return { g, moves, merges, gained, moved };
}
const canMove = (g) => [0, 1, 2, 3].some((d) => slide(g, d).moved);
const bestOfGrid = (g) => Math.max(0, ...g.flat());
/** New tile number k: from the race seed, so every board draws the same numbers in the same order. */
function spawn(B) {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!B.g[r][c]) empty.push([r, c]);
  const rnd = mulberry32((B.seed ^ Math.imul(B.k + 1, 0x9e3779b1)) >>> 0);

}
function newBoard(seed, start) {
  const B = { seed, g: Array.from({ length: N }, () => Array(N).fill(0)), score: 0, n: 0, k: 0, dir: -1, best: 0, reachedAt: 0, jamAt: 0, anim: null };
  if (start) B.g = start.map((row) => row.slice());

}
/** One move. Returns what happened (for effects), or null if nothing could slide that way. */
function move(B, dir, now) {
  if (B.jamAt) return null;
  const res = slide(B.g, dir);
  if (!res.moved) return null;
  B.g = res.g; B.score += res.gained; B.n++; B.dir = dir;
  const born = spawn(B), was = B.best;
  B.best = bestOfGrid(B.g);
  if (B.best >= targetExp() && !B.reachedAt) B.reachedAt = Date.now();
  B.anim = { at: now, moves: res.moves, merges: res.merges, born };
  if (!canMove(B.g)) B.jamAt = now + CONFIG.jamMs;
  return { merges: res.merges, gained: res.gained, newBest: B.best > was ? B.best : 0 };
}
/** A stuck board sheds every tile of its smallest number, then play goes on. */
function stepBoard(B, now) {
  if (!B.jamAt || now < B.jamAt) return null;
  const low = Math.min(...B.g.flat().filter((v) => v)), shed = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (B.g[r][c] === low) { shed.push([r, c, low]); B.g[r][c] = 0; }
  B.jamAt = 0; B.anim = null;
  return { shed };
}
const LETTERS = ".abcdefghijklmnopq";
/** A board as it goes on the wire: one short JSON string. */
const packBoard = (B, m) => JSON.stringify({ m, g: B.g.flat().map((v) => LETTERS[v] || ".").join(""), s: B.score, t: B.best, n: B.n, k: B.k, d: B.dir, h: B.reachedAt, j: B.jamAt ? 1 : 0 });
const unpackGrid = (str) => Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => Math.max(0, LETTERS.indexOf(String(str || "")[r * N + c] || "."))));

// ── RACE (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, was: false, bots: new Map(), botsRaw: "", lastBots: 0 };
function race() {
  const m = cached("race", S.shared.race, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeRace(m) { m = { ...m, v: (race()?.v ?? 0) + 1 }; host.last = m; net.setShared("race", JSON.stringify(m)); return m; }
const nameOf = (m, id) => (id === net.sessionId ? myName : m?.bots.find((b) => b.i === id)?.n) || String(S.entities.players?.[id]?.n ?? "Player").slice(0, 12);
const colorOf = (m, id) => (id === net.sessionId ? myColor : m?.bots.find((b) => b.i === id)?.c) || S.entities.players?.[id]?.c || "#aaa";
const isBot = (m, id) => !!m && m.bots.some((b) => b.i === id);
const newBot = (B) => ({ B, nextAt: 0, mistake: CONFIG.botMistake, pace: 1 });
let startGrid = null; // ?attract starts every board from the same mid-race grid

function newRace(id) {
  const hs = humans().slice(0, CONFIG.seats), used = new Set(hs.map((h) => colorOf(null, h))), free = COLORS.filter((c) => !used.has(c)), names = [...BOT_NAMES].sort(() => Math.random() - 0.5);
  const bots = Array.from({ length: Math.max(hs.length ? 0 : 1, CONFIG.seats - hs.length) }, (_, k) => ({ i: "bot" + (k + 1), n: names[k], c: free[k % free.length] }));
  const seed = (Math.random() * 1e9) | 0, startAt = Date.now() + CONFIG.countdownMs;
  host.bots = new Map(bots.map((b) => [b.i, newBot(newBoard(seed, startGrid))]));
  if (ATTRACT) Object.assign(host.bots.get("bot1"), { mistake: 0, pace: 0.75 }); // the big board in the preview plays a little better
  return { id, ph: "count", seed, startAt, endsAt: startAt + CONFIG.raceMs, players: [...hs, ...bots.map((b) => b.i)], bots, out: [], winner: "", nextAt: 0, ready: [] };
}
/** Become host: take the bots' boards over exactly as state has them. */
function adopt() {
  host.was = true; host.last = null; host.bots = new Map();
  const m = race();
  if (!m) return;
  for (const v of cached("bots", S.shared.bots, [])) if (v.m === m.id) host.bots.set(v.i, newBot(boardFromView(v, m.seed)));
  for (const b of m.bots) if (!host.bots.has(b.i)) host.bots.set(b.i, newBot(newBoard(m.seed, startGrid)));
}
function boardFromView(v, seed) {
  const B = newBoard(seed, unpackGrid(v.g));
  Object.assign(B, { score: v.s || 0, n: v.n || 0, k: v.k || 0, dir: v.d ?? -1, reachedAt: v.h || 0 });
  if (!canMove(B.g)) B.jamAt = performance.now() + CONFIG.jamMs;

}
/** What this client knows of a board: live for itself (and the host's bots), the last snapshot for the rest. */
function boardOf(m, id) {
  if (isBot(m, id) && isHost()) { const B = host.bots.get(id)?.B; return B && { best: B.best, score: B.score, at: B.reachedAt }; }
  if (isBot(m, id)) { const v = cached("bots", S.shared.bots, []).find((x) => x.i === id); return v && v.m === m.id ? { best: v.t || 0, score: v.s || 0, at: v.h || 0 } : null; }
  if (id === net.sessionId) return me.B && me.m === m.id ? { best: me.B.best, score: me.B.score, at: me.B.reachedAt } : null;
  const b = cached("b:" + id, S.entities.players?.[id]?.b, null);
  return b && b.m === m.id ? { best: b.t || 0, score: b.s || 0, at: b.h || 0 } : null;

/** Best first: the target reached, earliest; then the best tile; then score. */
function standings(m) {
  const info = (id) => boardOf(m, id) || { best: 0, score: 0, at: 0 };
  const key = (id) => { const b = info(id); return [b.best >= targetExp() ? 1 : 0, b.best >= targetExp() ? -b.at : 0, b.best, b.score]; };
  return m.players.filter((id) => !m.out.includes(id)).sort((a, b) => { const ka = key(a), kb = key(b); for (let i = 0; i < 4; i++) if (ka[i] !== kb[i]) return kb[i] - ka[i]; return 0; });
}
/** One winner, or none on a dead heat (same best tile and score, nobody at the target). */
function pickWinner(m) {
  const order = standings(m), a = boardOf(m, order[0]), b = boardOf(m, order[1]);
  if (!a) return "";
  if (b && a.best === b.best && a.score === b.score && !(a.best >= targetExp() && a.at !== b.at)) return "";

function hostTick(nowMs, t) {
  if (!host.was) adopt();
  let m = race();
  if (!m) m = writeRace(newRace(1));
  if (m.ph === "count" && nowMs >= m.startAt) m = writeRace({ ...m, ph: "play" });
  if (m.ph === "play") {
    botsTick(m, t);
    const live = new Set(livePlayers()), left = m.players.filter((id) => !isBot(m, id) && id !== net.sessionId && !m.out.includes(id) && !live.has(id));
    if (left.length) m = writeRace({ ...m, out: [...m.out, ...left] }); // left, or frozen (no heartbeat for 3s)
    const hadHumans = m.players.some((id) => !isBot(m, id)), humansIn = m.players.some((id) => !isBot(m, id) && !m.out.includes(id));
    const done = m.players.some((id) => !m.out.includes(id) && (boardOf(m, id)?.best || 0) >= targetExp());
    if (done || nowMs >= m.endsAt || (hadHumans && !humansIn)) writeRace({ ...m, ph: "over", winner: pickWinner(m), places: standings(m), nextAt: nowMs + CONFIG.overMs, ready: [] });

}
function onReady(from) {
  const m = race();
  if (!m || m.ph !== "over" || m.ready.includes(from)) return;
  const ready = [...m.ready, from];
  writeRace({ ...m, ready, nextAt: humans().every((id) => ready.includes(id)) ? Math.min(m.nextAt, Date.now() + 1200) : m.nextAt });

// ── BOTS (HOST) ─────────────────────────────────────────────────────────────────────
// A bot keeps its biggest tiles snaking along the top row from the left corner. For each
// move it imagines a new 2 landing in each empty cell, then its best next move, and picks
// the move that does best on average (a two-move look-ahead).
const SNAKE = [[0, 1, 2, 3], [7, 6, 5, 4], [8, 9, 10, 11], [15, 14, 13, 12]];
function rateGrid(g) {
  let s = 0, empty = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { if (g[r]?.[c]) s += 2 ** g[r][c] * 0.5 ** (SNAKE[r]?.[c] ?? 15); else empty++; }

function lookAhead(g) {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!g[r][c]) empty.push([r, c]);

  for (const [r, c] of empty) {
    g[r][c] = 1;
    let best = rateGrid(g) * 0.05; // no move left after this tile: very bad

  if (!options.length) return -1;
  for (const o of options) o.v = lookAhead(o.res.g);

function botsTick(m, t) {
  for (const [id, bot] of host.bots) {
    if (m.out.includes(id)) continue;

}

  requestAnimationFrame(frame);
  const t = performance.now(), dt = Math.max(0, Math.min(0.05, (t - (last || t)) / 1000));
  if (last && t - last > 1000) { wakeHold = t + 700; host.was = false; host.last = null; } // woke from a freeze or a background tab: another player may have run the race meanwhile, so let their state arrive, then adopt it like a new host
  last = t;
  if (t - lastHb > 1000) { lastHb = t; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(Date.now(), t); else host.was = false;
  const m = race();
  if (m) myTick(m, t);
  draw(m, t, dt);
  if (t - lastHud > 150) { lastHud = t; hud(m); }
}

(async function start() {
  if (ATTRACT) { // the preview: four bots racing from a mid-race board, fast
    Object.assign(CONFIG, { countdownMs: 200, botMoveMs: 120, botMistake: 0.05, overMs: 3500 });
    startGrid = [[8, 6, 5, 4], [1, 2, 3, 3], [1, 0, 0, 0], [0, 0, 0, 0]]; // 256 in the corner: 512 is close
  }
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { lastHud = 0; });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { writeRace(newRace(1)); host.was = true; }
  requestAnimationFrame(frame);
})();
</script>
